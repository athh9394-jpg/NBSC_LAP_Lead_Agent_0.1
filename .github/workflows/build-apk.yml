name: Build NBSC LAP APK
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/secure-agent-ownership
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/build-apk.yml"
permissions:
  contents: read
jobs:
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - name: Build web dashboard
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: nbsc-lap-web-build
          path: frontend/dist/
          retention-days: 14
  android-apk:
    runs-on: ubuntu-latest
    needs: web-build
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Install Capacitor Android build tools
        run: npm install --save-exact @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.nbsc.lapleadagent",
            "appName": "NBSC LAP Lead Agent",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
      - run: npm run build
      - name: Create Android project
        run: npx cap add android
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: nbsc-lap-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
