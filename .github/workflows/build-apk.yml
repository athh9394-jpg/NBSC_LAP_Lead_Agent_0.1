name: Build NBSC LAP APK
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/secure-agent-ownership
    paths:
      - "frontend/**"
      - "backend/**"
      - "android/**"
      - ".github/workflows/build-apk.yml"
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies and test tools
        run: python -m pip install -r backend/requirements.txt pytest httpx
      - name: Run backend API tests using isolated SQLite and mocked Supabase Auth
        run: pytest -q backend/tests

  web-build:
    needs: backend-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build web dashboard
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: nbsc-lap-web-build
          path: frontend/dist/
          retention-days: 14
  android-apk:
    runs-on: ubuntu-latest
    needs: web-build
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Locate and install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager not found under $ANDROID_HOME/cmdline-tools"
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - run: npm install
      - name: Install Capacitor Android build tools
        run: npm install --save-exact @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.nbsc.lapleadagent",
            "appName": "NBSC LAP Lead Agent",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
      - run: npm run build
      - name: Create Android project
        run: npx cap add android
      - run: npx cap sync android
      - name: Install native backup download bridge
        run: |
          test -s ../android/app/src/main/java/com/nbsc/laplead/MainActivity.java
          mkdir -p android/app/src/main/java/com/nbsc/lapleadagent
          sed 's/^package com\.nbsc\.laplead;$/package com.nbsc.lapleadagent;/' ../android/app/src/main/java/com/nbsc/laplead/MainActivity.java > android/app/src/main/java/com/nbsc/lapleadagent/MainActivity.java
          grep -q 'package com.nbsc.lapleadagent;' android/app/src/main/java/com/nbsc/lapleadagent/MainActivity.java
          grep -q 'installBlobDownloadHandler' android/app/src/main/java/com/nbsc/lapleadagent/MainActivity.java
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Verify APK and calculate SHA-256
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: nbsc-lap-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
